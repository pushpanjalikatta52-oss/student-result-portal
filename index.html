<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration & Result Portal</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f2f5f9;
    }
    .box {
      max-width: 700px;
      margin: 40px auto;
    }
  </style>
</head>

<body>

<div class="container box">
  <div class="card shadow">
    <div class="card-header bg-primary text-white text-center">
      <h3>Student Registration & Result Portal</h3>
    </div>

    <div class="card-body">
      <form id="studentForm">

        <input type="text" id="name" class="form-control mb-3"
               placeholder="Student Name">

        <input type="text" id="roll" class="form-control mb-3"
               placeholder="Roll Number">

        <select id="course" class="form-select mb-3">
          <option value="">Select Course</option>
          <option>CSE</option>
          <option>ECE</option>
          <option>EEE</option>
          <option>IT</option>
        </select>

        <div class="row">
          <div class="col-md-4">
            <input type="number" id="html" class="form-control mb-3"
                   placeholder="HTML Marks" min="0" max="100">
          </div>

          <div class="col-md-4">
            <input type="number" id="bootstrap" class="form-control mb-3"
                   placeholder="Bootstrap Marks" min="0" max="100">
          </div>

          <div class="col-md-4">
            <input type="number" id="js" class="form-control mb-3"
                   placeholder="JavaScript Marks" min="0" max="100">
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100">
          Calculate Result
        </button>
      </form>

      <div id="result" class="mt-4"></div>
    </div>
  </div>
</div>

<script>
document.getElementById("studentForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let name = document.getElementById("name").value.trim();
  let roll = document.getElementById("roll").value.trim();
  let course = document.getElementById("course").value;

  let html = Number(document.getElementById("html").value);
  let bootstrap = Number(document.getElementById("bootstrap").value);
  let js = Number(document.getElementById("js").value);

  if (!name || !roll || !course ||
      isNaN(html) || isNaN(bootstrap) || isNaN(js)) {
    document.getElementById("result").innerHTML =
      '<div class="alert alert-danger">Please fill all fields.</div>';
    return;
  }

  let total = html + bootstrap + js;
  let percentage = (total / 300 * 100).toFixed(2);

  let status = (html >= 35 && bootstrap >= 35 && js >= 35)
               ? "PASS" : "FAIL";

  document.getElementById("result").innerHTML = `
    <div class="alert alert-info">
      <h4>Student Result</h4>
      <p><b>Name:</b> ${name}</p>
      <p><b>Roll Number:</b> ${roll}</p>
      <p><b>Course:</b> ${course}</p>

      <table class="table table-bordered">
        <tr><th>Subject</th><th>Marks</th></tr>
        <tr><td>HTML</td><td>${html}</td></tr>
        <tr><td>Bootstrap</td><td>${bootstrap}</td></tr>
        <tr><td>JavaScript</td><td>${js}</td></tr>
        <tr><th>Total</th><th>${total}/300</th></tr>
        <tr><th>Percentage</th><th>${percentage}%</th></tr>
        <tr><th>Status</th><th>${status}</th></tr>
      </table>
    </div>
  `;
});
</script>

</body>
</html>
